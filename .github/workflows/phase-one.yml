name: Verificar fase 1
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  benchmark:
    if: github.head_ref == 'feature/1.5.3-rendimiento'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - run: bash scripts/benchmark-phase1.sh
  emulator:
    if: github.head_ref == 'feature/1.5.3-rendimiento'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar copia R8 de prueba con la identidad de depuración del runner
        run: |
          cat > "$RUNNER_TEMP/emulator.gradle" <<'GRADLE'
          allprojects {
              plugins.withId('com.android.application') {
                  androidComponents.finalizeDsl { dsl ->
                      dsl.testBuildType = 'release'
                      dsl.buildTypes.release.signingConfig = dsl.signingConfigs.debug
                  }
              }
          }
          GRADLE
          ./gradlew -I "$RUNNER_TEMP/emulator.gradle" assembleRelease assembleReleaseAndroidTest
      - name: Habilitar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            python3 scripts/verify-phase1-ui.py
            ./gradlew -I "$RUNNER_TEMP/emulator.gradle" connectedReleaseAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pantallas-sinteticas
          path: build/phase1-ui/*.png
